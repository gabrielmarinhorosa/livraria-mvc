<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livraria · MVC</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 small { font-size: .5em; color: #888; font-weight: normal; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; }
    input { padding: .4rem; flex: 1; min-width: 120px; }
    button { padding: .4rem 1rem; cursor: pointer; }
    .erro { background: #fde2e2; color: #900; padding: .5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- VIEW: só exibe os dados recebidos do Controller -->
  <h1>📚 Livraria <small>arquitetura MVC</small></h1>

  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

  <table>
    <tr><th>#</th><th>Título</th><th>Autor</th><th>Preço</th></tr>
    {% for livro in livros %}
    <tr>
      <td>{{ livro.id }}</td>
      <td>{{ livro.titulo }}</td>
      <td>{{ livro.autor }}</td>
      <td>R$ {{ "%.2f"|format(livro.preco) }}</td>
    </tr>
    {% endfor %}
  </table>

  <h3>Cadastrar livro</h3>
  <form method="post" action="/livros">
    <input name="titulo" placeholder="Título" required>
    <input name="autor" placeholder="Autor" required>
    <input name="preco" type="number" step="0.01" min="0" placeholder="Preço" required>
    <button type="submit">Adicionar</button>
  </form>
</body>
</html>
